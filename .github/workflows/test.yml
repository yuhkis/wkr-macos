name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift-test:
    # Pinned rather than macos-latest: Package.swift declares swift-tools-version 6.2,
    # so an older default toolchain on a moving runner image would fail to parse it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Show toolchain
        run: swift --version
      - name: Check public boundary and bundled resources
        run: python3 Scripts/check-public.py
      - name: Run tests
        run: swift test
      - name: Build the ad-hoc candidate without installing
        run: make app
