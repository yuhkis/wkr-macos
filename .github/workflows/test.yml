name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift-test:
    # Pinned rather than macos-latest: Package.swift declares swift-tools-version 6.2,
    # so an older default toolchain on a moving runner image would fail to parse it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect every reachable public ref
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/origin/pr/*' --tags --quiet
          python3 Scripts/publication_guard.py audit --report "$RUNNER_TEMP/publication-audit.json"
          python3 Scripts/test_publication_guard.py
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Show toolchain
        run: swift --version
      - name: Check public boundary and bundled resources
        run: python3 Scripts/check-public.py
      - name: Run tests
        run: swift test
      - name: Build the ad-hoc candidate without installing
        run: make app

      - name: Verify the v1 archive source and boundaries
        run: |
          python3 Scripts/check-v1-archive.py
          make -C Legacy/wkr-macos-v1 test
          make -C Legacy/wkr-macos-v1 app
          python3 Scripts/package-v1-archive.py
